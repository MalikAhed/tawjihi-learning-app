name: Bug report
description: Report a reproducible problem in the app.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: Android 14, Chrome 128
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add safe screenshots or logs. Never include passwords, contacts, tokens, payment evidence, or student data.
