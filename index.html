<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="learn-account-mode" content="http" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مساحة التعلّم</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="assets/app/manifest.json" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="مساحة التعلّم" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet" media="print" data-background-style />
  <link rel="stylesheet" href="src/styles/splash.css" />
  <link rel="preload" href="assets/mascot/rocky-light-still.svg" as="image" />
  <link rel="preload" href="assets/brand/khotwa-wordmark.svg" as="image" />
  <link rel="stylesheet" href="src/styles/base.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/media.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/course-map.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/learner-dashboard.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/subject-learning.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson/mcq.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson/published.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson/navigation.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson/completion.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/lesson/progress.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/visitor-flow.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/responsive.css" media="print" fetchpriority="high" data-app-style />
  <link rel="stylesheet" href="src/styles/system.css" media="print" fetchpriority="high" data-app-style />
</head>
<body data-startup data-expanded-components="hidden">
  <section id="app-splash" class="app-splash" aria-label="جارٍ تجهيز خطوة">
    <div class="app-splash__composition">
      <div class="app-splash__mascot"><img src="assets/mascot/rocky-light-still.svg" alt="" width="540" height="505" fetchpriority="high" /></div>
      <img class="app-splash__wordmark" src="assets/brand/khotwa-wordmark.svg" alt="خطوة" width="468" height="190" fetchpriority="high" />
      <div class="app-splash__progress" role="progressbar" aria-label="تجهيز مساحة التعلّم" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="app-splash__fill"></span><span class="app-splash__percentage" aria-hidden="true">0%</span>
      </div>
      <p class="app-splash__status" role="status">جارٍ تجهيز مساحة التعلّم…</p>
      <div class="app-splash__recovery" role="alert" hidden><p>تعذّر إكمال التحميل. تحقّق من الاتصال وحاول مجددًا.</p><button type="button">إعادة المحاولة</button></div>
      <noscript>فعّل JavaScript لاستخدام مساحة التعلّم.</noscript>
    </div>
  </section>
  <template id="app-header-template">
    <div class="app-stats-bar" aria-label="ملخص التقدم" data-shell-obstruction>
      <span class="app-stat app-stat--streak" aria-label="السلسلة اليومية: 0"><img src="assets/icons/dashboard-streak.svg" alt="" aria-hidden="true" /><bdi class="ui-number" data-header-streak-count>0</bdi></span>
      <span class="app-stat app-stat--gems" aria-label="0 جواهر"><img src="assets/icons/nav-gem.svg" alt="" aria-hidden="true" /><bdi class="ui-number">0</bdi></span>
      <span class="app-stat app-stat--hearts" aria-label="0 قلوب"><img src="assets/icons/nav-heart.svg" alt="" aria-hidden="true" /><bdi class="ui-number">0</bdi></span>
    </div>
    <div class="nav-resources" aria-label="الجواهر والقلوب وتجميد السلسلة" data-shell-obstruction data-expanded-component><span class="nav-resource nav-resource--gems" aria-label="0 جواهر"><img src="assets/icons/nav-gem.svg" alt="" aria-hidden="true" width="36" height="36" /><bdi class="ui-number">0</bdi></span><span class="nav-resource nav-resource--hearts" aria-label="0 قلوب"><img src="assets/icons/nav-heart.svg" alt="" aria-hidden="true" width="36" height="36" /><bdi class="ui-number">0</bdi></span><span class="nav-resource nav-resource--freeze" data-learner-streak-freeze aria-label="0 من أدوات تجميد السلسلة" hidden><img src="assets/icons/streak-freeze.svg" alt="" aria-hidden="true" width="36" height="36" /><bdi class="ui-number">0</bdi></span></div>
  <header class="topbar-wrap" data-shell-obstruction><div class="page topbar">

    <nav class="nav-links" aria-label="التنقل الرئيسي">
      <button class="nav-item active" type="button" data-page="learn" aria-label="التعلّم" aria-current="page"><div class="nav-icon"><img src="assets/icons/duolingo-nav-learn.webp" alt="" /></div><span>التعلّم</span></button>
      <button class="nav-item" type="button" data-page="quests" aria-label="المهام"><div class="nav-icon"><img src="assets/icons/duolingo-nav-quests.webp" alt="" /></div><span>المهام</span></button>
      <button class="nav-item" type="button" data-page="shop" aria-label="المتجر"><div class="nav-icon"><img src="assets/icons/shop_transparent_clean.webp" alt="" /></div><span>المتجر</span></button>
      <button class="nav-item" type="button" data-page="league" aria-label="الدوري"><div class="nav-icon"><img src="assets/icons/duolingo-nav-league.webp" alt="" /></div><span>الدوري</span></button>
      <button class="nav-item" type="button" data-page="friends" aria-label="الأصدقاء"><div class="nav-icon"><img src="assets/icons/duolingo-nav-friends.webp" alt="" /></div><span>الأصدقاء</span></button>
      <button class="nav-item" type="button" data-page="super" aria-label="سوبر"><div class="nav-icon"><img src="assets/icons/duolingo-nav-super.webp" alt="" /></div><span>سوبر</span></button>
      <button class="nav-item" type="button" data-page="more" aria-label="المزيد"><div class="nav-icon"><img src="assets/icons/duolingo-nav-more.webp" alt="" /></div><span>المزيد</span></button>
    </nav>
    <div class="topbar-auth" data-shell-obstruction>
      <div class="topbar-auth-guest">
        <button class="topbar-login" type="button" data-auth-flow="sign-in">تسجيل الدخول</button>
        <button class="topbar-create" type="button" data-auth-flow="register">إنشاء حساب</button>
      </div>
      <div class="topbar-auth-member" hidden>
        <div class="topbar-profile">
          <span class="topbar-profile__avatar" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="11" r="5" fill="currentColor"/><path d="M6 27v-2a10 10 0 0 1 20 0v2" fill="currentColor"/></svg></span>
          <span data-account-label>حساب مجاني</span>
        </div>
        <button class="topbar-login" type="button" data-auth-sign-out>تسجيل الخروج</button>
      </div>
    </div>
  </div></header>
  </template>
  <div id="visitor-flow-root" hidden></div>
  <main class="page">
    <section class="column" aria-labelledby="learning-path-title">
      <h1 class="visually-hidden" id="learning-path-title">المواد الدراسية للتوجيهي</h1>
      <div class="course-units"><div class="app-loading" role="status" aria-live="polite"><p>جارٍ تجهيز مساحة التعلّم…</p><noscript>فعّل JavaScript لاستخدام مساحة التعلّم.</noscript></div></div>
    </section>
    <section class="coming-soon" aria-label="المزيد"></section>
    <section class="lesson-view">
      <div class="lesson-shell">
        <div class="lesson-top">
          <button class="lesson-back" type="button" aria-label="العودة إلى المواد الدراسية"><svg class="lesson-back__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>المواد الدراسية</span></button>
          <div class="lesson-top-title"><span class="current-view-title">المحتوى</span></div>
          <span class="lesson-status">قيد التقدم</span>
        </div>
        <div class="lesson-card" id="lesson-content" tabindex="-1"></div>
      </div>
    </section>
  </main>
  <p id="coming-soon-toast" class="coming-soon-toast" role="status" aria-live="polite" hidden></p>
  <script type="module" src="src/bootstrap.js"></script>
</body>
</html>
