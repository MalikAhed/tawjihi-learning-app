  <div id="visitor-flow-root" hidden></div>
  <main class="page">
    <section class="column" aria-labelledby="learning-path-title">
      <h1 class="visually-hidden" id="learning-path-title">المواد الدراسية للتوجيهي</h1>

    </section>
    <section class="coming-soon" aria-live="polite">
      <div class="coming-soon-card">
        <div data-coming-soon-content></div>
        <div class="more-tabs" dir="rtl" hidden>
          <header class="developer-heading" dir="rtl"><span>مساحة التطوير</span><h1>جرّب. صمّم. طوّر.</h1><p>مساحتك لتجربة الأفكار وتحسينها قبل وصولها إلى المتعلّمين.</p></header>
          <div class="more-tab-list" role="tablist" aria-label="أدوات التطوير">
            <button class="more-tab" id="ui-lab-tab" type="button" role="tab" aria-selected="true" aria-controls="ui-lab-panel" tabindex="0" data-more-tab="ui-lab">مختبر الواجهات</button>
            <button class="more-tab" id="ship-ready-tab" type="button" role="tab" aria-selected="false" aria-controls="ship-ready-panel" tabindex="-1" data-more-tab="ship-ready">جاهز للاستخدام</button>

            <button class="more-tab" id="data-tab" type="button" role="tab" aria-selected="false" aria-controls="data-panel" tabindex="-1" data-more-tab="data">البيانات</button>
          </div>
          <div class="more-tab-panel" id="studio-panel" role="tabpanel" aria-labelledby="studio-tab" hidden></div>
          <div class="more-tab-panel" id="data-panel" role="tabpanel" aria-labelledby="data-tab" hidden></div>
          <div class="more-tab-panel" id="ui-lab-panel" role="tabpanel" aria-labelledby="ui-lab-tab"></div>
          <div class="more-tab-panel" id="ship-ready-panel" role="tabpanel" aria-labelledby="ship-ready-tab" hidden></div>
          <div class="more-tab-panel" id="design-system-panel" role="tabpanel" aria-labelledby="design-system-tab" hidden></div>
        </div>
      </div>
    </section>
    <section class="lesson-view">

        <div class="lesson-top">
          <button class="lesson-back" type="button" aria-label="العودة إلى المواد الدراسية"><svg class="lesson-back__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>المواد الدراسية</span></button>
          <div class="lesson-top-title"><span class="current-view-title">المحتوى</span></div>
          <span class="lesson-status">قيد التقدم</span>
        </div>
        <div class="lesson-card" id="lesson-content" tabindex="-1"></div>
      </div>
